name: PL Creators Suite CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Install pinned pnpm
        run: |
          npm install --global pnpm@10.31.0
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit

      - name: Renderer lint
        run: pnpm --filter renderer lint

      - name: Platform types
        run: pnpm test:platform-types

      - name: Capability registry
        run: pnpm capabilities:validate

      - name: v1.2 capability milestone gate
        run: pnpm capabilities:gate:v1.2

      - name: Platform service discovery
        run: pnpm test:platform-services

      - name: Platform service behavior
        run: pnpm test:platform-service-behavior

      - name: Platform project and assets
        run: pnpm test:platform-project-assets

      - name: Project platform bridge
        run: pnpm test:project-platform-bridge

      - name: Project platform service
        run: pnpm test:project-platform-service

      - name: Platform history behavior
        run: pnpm test:platform-history-behavior

      - name: Recovery closeout
        run: pnpm test:project-recovery-closeout

      - name: Platform core APIs
        run: pnpm test:platform-core-apis

      - name: Platform orchestration APIs
        run: pnpm test:platform-orchestration-apis

      - name: Platform contribution APIs
        run: pnpm test:platform-contribution-apis

      - name: Platform two-slice consumers
        run: pnpm test:platform-two-slice-consumers

      - name: Renderer platform runtime adoption
        run: pnpm test:renderer-platform-runtime

      - name: Desktop File API
        run: pnpm test:desktop-file-api

      - name: Desktop task service
        run: pnpm test:desktop-tasks

      - name: Desktop Task API
        run: pnpm test:desktop-task-api

      - name: Desktop Workflow API
        run: pnpm test:desktop-workflow-api

      - name: Shell platform
        run: pnpm test:shell-platform

      - name: Shell shortcuts
        run: pnpm test:shell-shortcuts

      - name: RPC contracts
        run: pnpm test:rpc

      - name: RPC authorization
        run: pnpm test:rpc-authorization

      - name: Renderer architecture
        run: pnpm test:renderer-architecture

      - name: Desktop lifecycle
        run: pnpm test:desktop-lifecycle

      - name: Electron security perimeter
        run: pnpm test:electron-security

      - name: Desktop filesystem utility
        run: pnpm test:desktop-fs-util

      - name: Project indexing
        run: pnpm test:project-indexing-service

      - name: Snapshot integrity
        run: pnpm test:project-snapshot-service

      - name: Recovery drill
        run: pnpm test:project-recovery-drill

      - name: Global project search
        run: pnpm test:project-global-search

      - name: Shell accessibility
        run: pnpm test:shell-accessibility

      - name: Modal keyboard behavior
        run: pnpm test:modal-keyboard

      - name: Workspace build
        run: pnpm -r build
